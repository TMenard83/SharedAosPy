[project]
name = "aospy"
version = "0.1.0"
description = "Calcul de la force de combat d'armées Age of Sigmar (AoS)."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
analysis = [
    "pandas>=2.0.0",
    "statsmodels>=0.14.0",
]
gui = [
    "aospy[analysis]",
    "streamlit>=1.30.0",
]
roster = [
    "reportlab>=4.0",
    "pypdf>=4.0",
    "Pillow>=10.0",
]

[project.scripts]
aospy = "aospy.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
# Les CPython « autonomes » téléchargés par uv (python-build-standalone, 3.11.15 et 3.12
# testés le 2026-11-19) plantent dès que pyarrow (dépendance de pandas/streamlit) est chargé
# avec le module de hachage (`import pyarrow, _hashlib` → erreur de segmentation, donc aussi
# `import pandas`), quelle que soit la version de pyarrow (24, 25, 26). Le Python du système
# (3.14 de la distribution) n'a pas ce défaut : on force uv à ne jamais utiliser les siens.
python-preference = "only-system"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aospy.persistence" = ["*.sql"]
"aospy.tournament_kit" = ["assets/*.ttf", "assets/*.jpg"]
